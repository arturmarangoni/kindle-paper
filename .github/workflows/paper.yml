name: Imprimir o jornal

on:
  schedule:
    # Duas vezes por hora (UTC): o agendamento do GitHub atrasa e às vezes pula execuções, e assim uma pulada não
    # deixa o jornal velho. Fora dos minutos cheios, que são os mais congestionados.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # só para o commit mensal que mantém o agendamento ativo
  pages: write
  id-token: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o Stop Press
        uses: actions/checkout@v4
        with:
          repository: OPISGUY/stop-press
          path: stop-press-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stop-press-src/server/requirements.txt

      - name: Instalar dependências (Calibre para a edição diária)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends calibre > /dev/null
          pip install -q -r stop-press-src/server/requirements.txt

      - name: Recuperar o histórico do jornal
        uses: actions/cache@v4
        with:
          path: data
          key: paper-data-${{ github.run_id }}
          restore-keys: paper-data-

      - name: Imprimir
        run: SP=stop-press-src sh build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      # O GitHub desliga agendamentos de repositórios sem commits há 60 dias. Um commit por mês evita isso.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          [ "$(date -u +%d%H)" = "0100" ] || exit 0
          date -u +%Y-%m > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add .keepalive && git commit -m "keepalive $(date -u +%Y-%m)" && git push
